
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noir & Feu — L'Atelier du Cookie d'Exception</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,400;1,600&family=Montserrat:wght@200;400;700&display=swap');
        
        :root {
            --color-ebene: #111111;
            --color-or: #C5A059;
            --color-creme: #FDFCFA;
            --color-rouge-sombre: #5E0D0D;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-creme);
            color: var(--color-ebene);
        }
        
        h1, h2, h3, h4, .font-serif {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.02em;
        }

        .gold-gradient {
            background: linear-gradient(135deg, #C5A059 0%, #E8D19F 50%, #C5A059 100%);
        }

        .nav-link {
            transition: all 0.4s ease;
            position: relative;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: var(--color-or);
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }
        
        .nav-link:hover::after {
            width: 100%;
        }

        .btn-elegant {
            background-color: var(--color-ebene);
            color: white;
            border: 1px solid var(--color-or);
            transition: all 0.3s ease;
        }

        .btn-elegant:hover {
            background-color: var(--color-or);
            color: var(--color-ebene);
            box-shadow: 0 10px 30px -10px rgba(197, 160, 89, 0.4);
        }

        @keyframes gold-shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(197, 160, 89, 0.2), transparent);
            background-size: 200% 100%;
            animation: gold-shimmer 3s infinite linear;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.2.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
